{% extends "base.html" %}{% block title %}Criar conta | Fatec Eventos{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-card"><span class="eyebrow">FAÇA PARTE</span><h1>Crie sua conta.</h1><p>Inscreva-se nos eventos e acompanhe sua jornada acadêmica.</p><form method="post" class="auth-form"><label>Nome completo<input name="name" required minlength="3" autocomplete="name"></label><label>E-mail<input type="email" name="email" required autocomplete="email"></label><label>Senha<input type="password" name="password" required minlength="8" autocomplete="new-password"><small>Use pelo menos 8 caracteres.</small></label><button class="btn btn-primary btn-full">Criar conta ↗</button></form><p class="auth-bottom">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p></div></section>{% endblock %}
