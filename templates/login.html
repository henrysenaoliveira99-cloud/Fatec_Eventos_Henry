{% extends "base.html" %}{% block title %}Entrar | Fatec Eventos{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-card"><span class="eyebrow">BEM-VINDO DE VOLTA</span><h1>Acesse sua conta.</h1><p>Entre para acompanhar suas inscrições e novidades.</p><form method="post" class="auth-form"><label>E-mail<input type="email" name="email" required autocomplete="email"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-primary btn-full">Entrar ↗</button></form><p class="auth-bottom">Ainda não tem conta? <a href="{{ url_for('register') }}">Cadastre-se</a></p></div></section>{% endblock %}
